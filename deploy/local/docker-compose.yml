services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: "enterprise-rag-knowledge-assistant:latest"
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
