services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: "enterprise-rag-knowledge-assistant:latest"
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for uploaded documents (Phase 2 -- see docs/adr/0011-phase2-stack.md).
  # Credentials below are local/dev-only defaults, matching .env.example -- never used for a
  # real deployment.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragminio
      MINIO_ROOT_PASSWORD: ragminio123
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
