name: Deploy

# Phase 10 only: this workflow is intentionally manual while cloud deployment is deferred by
# ADR-0010. It reuses a release image and requires the OIDC prerequisites in docs/deployment.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: >-
      ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC -- no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine image reference
        id: image
        run: |
          echo "ref=ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        working-directory: infra/environments/dev
        env:
          TF_VAR_image: ${{ steps.image.outputs.ref }}
          TF_VAR_ghcr_username: ${{ github.actor }}
          TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
                          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
                          -backend-config="container_name=tfstate" \
                          -backend-config="key=enterprise-rag-knowledge-assistant/dev.tfstate"
          terraform apply -auto-approve -var-file=dev.tfvars

      - name: Smoke test
        working-directory: infra/environments/dev
        run: |
          APP_URL=$(terraform output -raw app_url)
          cd ../../..
          ./scripts/smoke-test.sh "$APP_URL"
